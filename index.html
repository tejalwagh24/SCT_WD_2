<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>TIME IS DYING</title>

  <!-- FONT -->

  <link rel="preconnect"
  href="https://fonts.googleapis.com">

  <link rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap"
  rel="stylesheet">

  <!-- CSS -->

  <link rel="stylesheet"
  href="style.css">

</head>

<body>

  <!-- CURSOR LIGHT -->

  <div class="cursor-light"></div>


  <!-- NOISE -->

  <div class="noise"></div>


  <!-- BACKGROUND -->

  <div class="background"></div>


  <!-- INTRO -->

  <section class="intro">

    <p class="small-text">
      TEMPORAL OBSERVATION SYSTEM
    </p>

    <h1>
      TIME NEVER STOPS.
    </h1>

    <span class="sub">
      every second disappears forever
    </span>

  </section>


  <!-- MAIN EXPERIENCE -->

  <section class="experience">

    <div class="time">

      <span id="hours">00</span>

      <span class="colon">:</span>

      <span id="minutes">00</span>

      <span class="colon">:</span>

      <span id="seconds">00</span>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

      <button id="start">
        START
      </button>

      <button id="pause">
        PAUSE
      </button>

      <button id="reset">
        RESET
      </button>

      <button id="lap">
        MEMORY
      </button>

    </div>


    <!-- MEMORY STREAM -->

    <div class="memory-stream">

      <p>
        RECORDED MOMENTS
      </p>

      <div id="laps"></div>

    </div>

  </section>


  <!-- JS -->

  <script src="script.js"></script>

</body>
</html>
